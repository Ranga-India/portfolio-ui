<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Robing Room - Ad Submission Portal</title>
    <style>
        /* Compact & Modern CSS */
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f4f7f6;
            --border-color: #dcdde1;
            --text-color: #333;
        }
        body { 
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            line-height: 1.4; 
            padding: 20px 10px; 
            margin: 0;
            font-size: 0.95rem;
        }
        .container { 
            max-width: 800px; 
            margin: 0 auto; 
            background: #fff; 
            padding: 25px 35px; 
            border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
        }
        .header { text-align: center; margin-bottom: 20px; border-bottom: 2px solid var(--primary-color); padding-bottom: 15px; }
        .header h1 { color: var(--primary-color); margin: 0 0 5px 0; font-size: 1.6rem; }
        
        .form-section { margin-bottom: 25px; }
        .form-section h3 { color: var(--primary-color); font-size: 1.1rem; margin-bottom: 12px; border-left: 3px solid var(--accent-color); padding-left: 8px; }
        
        .form-group { margin-bottom: 12px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        
        label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 0.9rem; }
        .help-text { font-size: 0.8rem; color: #7f8c8d; margin-top: 2px; display: block; font-weight: normal; }
        
        input[type="text"], input[type="email"], input[type="tel"], input[type="url"], select, textarea, input[type="file"] { 
            width: 100%; padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 4px; 
            box-sizing: border-box; font-family: inherit; font-size: 0.95rem; transition: all 0.2s ease; 
        }
        input:focus, select:focus, textarea:focus { border-color: var(--accent-color); outline: none; box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.15); }
        
        .placement-card { background: #f8f9fa; border: 1px solid var(--border-color); border-radius: 6px; padding: 12px 15px; margin-bottom: 10px; }
        .placement-card h4 { margin: 0 0 10px 0; color: #444; font-size: 0.95rem;}
        
        .radio-list { display: flex; flex-direction: column; gap: 8px; }
        .radio-list label, .radio-group label { font-weight: normal; display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 0.9rem; }
        
        .radio-group { display: flex; gap: 20px; margin-bottom: 10px; }
        .conditional-section { background: #fafbfc; border: 1px dashed var(--border-color); padding: 15px; border-radius: 6px; margin-top: 10px; }
        
        button { background-color: var(--accent-color); color: white; padding: 12px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; font-weight: 600; width: 100%; transition: background-color 0.2s; margin-top: 10px; }
        button:hover { background-color: #2980b9; }

        @media (max-width: 600px) {
            .grid-2, .radio-group { grid-template-columns: 1fr; flex-direction: column; gap: 10px; }
            .container { padding: 20px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Advertise with The Robing Room</h1>
    </div>

    <form action="#" method="POST" enctype="multipart/form-data">
        
        <!-- Section 1: Advertiser Information -->
        <div class="form-section">
            <h3>1. Advertiser Information</h3>
            <div class="grid-2">
                <div class="form-group">
                    <label for="business-name">Business Name *</label>
                    <input type="text" id="business-name" name="business_name" required>
                </div>
                <div class="form-group">
                    <label for="business-type">Business Category *</label>
                    <select id="business-type" name="business_type" required>
                        <option value="">Select a category...</option>
                        <option value="law-firm">Law Firm</option>
                        <option value="legal-tech">Legal Technology</option>
                        <option value="recruiting">Legal Recruiting</option>
                        <option value="consulting">Consulting</option>
                        <option value="other">Other</option>
                    </select>
                </div>
            </div>
            <div class="grid-2">
                <div class="form-group">
                    <label for="contact-name">Contact Name *</label>
                    <input type="text" id="contact-name" name="contact_name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email Address *</label>
                    <input type="email" id="email" name="email" required>
                </div>
            </div>
        </div>

        <!-- Section 2: Ad Placement Selection -->
        <div class="form-section">
            <h3>2. Select Ad Placement (Choose One)</h3>
            
            <div class="grid-2">
                <div class="placement-card">
                    <h4>Sidebar Image (970 x 530)</h4>
                    <div class="radio-list">
                        <label><input type="radio" name="placement" value="home_page" required> Home Page</label>
                        <label><input type="radio" name="placement" value="blog_home"> Blog Home Page</label>
                        <label><input type="radio" name="placement" value="blog_login"> Blog Login Page</label>
                    </div>
                </div>

                <div class="placement-card">
                    <h4>Full-Width Banner (2560 x 265)</h4>
                    <div class="radio-list">
                        <label><input type="radio" name="placement" value="judge_review"> Judge Review Page</label>
                        <label><input type="radio" name="placement" value="blog_post"> Blog Post Page</label>
                    </div>
                </div>
            </div>
        </div>

        <!-- Section 3: Ad Creative -->
        <div class="form-section">
            <h3>3. Ad Creative & Destination</h3>
            
            <div class="form-group">
                <label for="redirect-url">Target URL (Ad Link) *</label>
                <input type="url" id="redirect-url" name="redirect_url" required placeholder="https://www.yourwebsite.com">
            </div>

            <div class="form-group">
                <label>Creative Format *</label>
                <div class="radio-group">
                    <label><input type="radio" name="creative_type" id="type-upload" value="upload" checked> Upload my ad</label>
                    <label><input type="radio" name="creative_type" id="type-build" value="build"> Provide details</label>
                </div>
            </div>

            <!-- Option A: Upload Finished Image -->
            <div class="conditional-section" id="upload-section">
                <div class="form-group">
                    <label for="ad-image">Upload Ad Image <span class="help-text">Ensure dimensions match your placement choice. JPG or PNG.</span></label>
                    <input type="file" id="ad-image" name="ad_image" accept="image/png, image/jpeg">
                </div>
            </div>

            <!-- Option B: Provide Details -->
            <div class="conditional-section" id="build-section" style="display: none;">
                <div class="grid-2">
                    <div class="form-group">
                        <label for="company-logo">Company Logo Image</label>
                        <input type="file" id="company-logo" name="company_logo" accept="image/png, image/jpeg">
                    </div>
                    <div class="form-group">
                        <label for="display-name">Display Company Name</label>
                        <input type="text" id="display-name" name="display_name">
                    </div>
                </div>
                <div class="form-group">
                    <label for="ad-header">Ad Headline</label>
                    <input type="text" id="ad-header" name="ad_header">
                </div>
                <div class="form-group">
                    <label for="ad-description">Ad Description</label>
                    <textarea id="ad-description" name="ad_description" rows="2"></textarea>
                </div>
            </div>
        </div>

        <button type="submit">Submit Advertisement Request</button>
    </form>
</div>

<!-- JavaScript to handle dynamic showing/hiding of creative sections -->
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const uploadRadio = document.getElementById('type-upload');
        const buildRadio = document.getElementById('type-build');
        const uploadSection = document.getElementById('upload-section');
        const buildSection = document.getElementById('build-section');

        function toggleCreativeSections() {
            if (uploadRadio.checked) {
                uploadSection.style.display = 'block';
                buildSection.style.display = 'none';
            } else {
                uploadSection.style.display = 'none';
                buildSection.style.display = 'block';
            }
        }

        uploadRadio.addEventListener('change', toggleCreativeSections);
        buildRadio.addEventListener('change', toggleCreativeSections);
    });
</script>

</body>
</html>
