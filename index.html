<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Robing Room - Ad Submission Portal</title>
    <style>
        /* Modern CSS Reset & Styling */
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f4f7f6;
            --border-color: #dcdde1;
            --text-color: #333;
        }
        body { 
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            line-height: 1.6; 
            padding: 40px 20px; 
            margin: 0;
        }
        .container { 
            max-width: 800px; 
            margin: 0 auto; 
            background: #fff; 
            padding: 50px; 
            border-radius: 12px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.08); 
        }
        .header { text-align: center; margin-bottom: 40px; border-bottom: 2px solid var(--primary-color); padding-bottom: 20px; }
        .header h1 { color: var(--primary-color); margin: 0 0 10px 0; font-size: 2rem; }
        .header p { color: #666; margin: 0; }
        
        .form-section { margin-bottom: 35px; }
        .form-section h3 { color: var(--primary-color); font-size: 1.25rem; margin-bottom: 20px; border-left: 4px solid var(--accent-color); padding-left: 10px; }
        
        .form-group { margin-bottom: 20px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        
        label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.95rem; }
        .help-text { font-size: 0.85rem; color: #7f8c8d; margin-top: 4px; display: block; font-weight: normal; }
        
        input[type="text"], input[type="email"], input[type="tel"], input[type="url"], select, textarea, input[type="file"] { 
            width: 100%; padding: 12px 15px; border: 1px solid var(--border-color); border-radius: 6px; 
            box-sizing: border-box; font-family: inherit; font-size: 1rem; transition: all 0.3s ease; 
        }
        input:focus, select:focus, textarea:focus { border-color: var(--accent-color); outline: none; box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.15); }
        
        .placement-card { background: #f8f9fa; border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; margin-bottom: 15px; }
        .placement-card h4 { margin: 0 0 15px 0; color: #444; }
        
        .checkbox-group { display: flex; flex-direction: column; gap: 12px; }
        .checkbox-group label, .radio-group label { font-weight: normal; display: flex; align-items: center; gap: 10px; cursor: pointer; }
        
        .radio-group { display: flex; gap: 30px; margin-bottom: 20px; }
        .conditional-section { background: #fafbfc; border: 1px dashed var(--border-color); padding: 25px; border-radius: 8px; margin-top: 15px; }
        
        button { background-color: var(--accent-color); color: white; padding: 16px 30px; border: none; border-radius: 6px; cursor: pointer; font-size: 1.1rem; font-weight: 600; width: 100%; transition: background-color 0.3s; margin-top: 20px; }
        button:hover { background-color: #2980b9; }

        @media (max-width: 600px) {
            .grid-2, .radio-group { grid-template-columns: 1fr; flex-direction: column; gap: 15px; }
            .container { padding: 30px 20px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Advertise With Us</h1>
        <p>Reach the legal community on The Robing Room</p>
    </div>

    <form action="#" method="POST" enctype="multipart/form-data">
        
        <!-- Section 1: Advertiser Information -->
        <div class="form-section">
            <h3>1. Advertiser Information</h3>
            <div class="grid-2">
                <div class="form-group">
                    <label for="business-name">Business Name *</label>
                    <input type="text" id="business-name" name="business_name" required placeholder="e.g., Apex Legal Services">
                </div>
                <div class="form-group">
                    <label for="business-type">Business Category *</label>
                    <select id="business-type" name="business_type" required>
                        <option value="">Select a category...</option>
                        <option value="law-firm">Law Firm</option>
                        <option value="legal-tech">Legal Technology / Software</option>
                        <option value="recruiting">Legal Recruiting</option>
                        <option value="consulting">Consulting Services</option>
                        <option value="other">Other</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label for="contact-name">Contact Person Name *</label>
                <input type="text" id="contact-name" name="contact_name" required>
            </div>
            <div class="grid-2">
                <div class="form-group">
                    <label for="email">Email Address *</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone">
                </div>
            </div>
        </div>

        <!-- Section 2: Ad Placement Selection -->
        <div class="form-section">
            <h3>2. Ad Placement</h3>
            
            <div class="placement-card">
                <h4>Sidebar Image (970 x 530 pixels)</h4>
                <div class="checkbox-group">
                    <label><input type="checkbox" name="placement" value="home_page"> Home Page</label>
                    <label><input type="checkbox" name="placement" value="blog_home"> Blog Home Page</label>
                    <label><input type="checkbox" name="placement" value="blog_login"> Blog Login Page</label>
                </div>
            </div>

            <div class="placement-card">
                <h4>Full-Width Banner (2560 x 265 pixels)</h4>
                <div class="checkbox-group">
                    <label><input type="checkbox" name="placement" value="judge_review"> Judge Review Page</label>
                    <label><input type="checkbox" name="placement" value="blog_post"> Blog Post Page</label>
                </div>
            </div>
        </div>

        <!-- Section 3: Ad Creative -->
        <div class="form-section">
            <h3>3. Ad Creative & Destination</h3>
            
            <div class="form-group">
                <label for="redirect-url">Target URL (Where should the ad link to?) *</label>
                <input type="url" id="redirect-url" name="redirect_url" required placeholder="https://www.yourwebsite.com">
            </div>

            <div class="form-group">
                <label>Creative Format *</label>
                <div class="radio-group">
                    <label><input type="radio" name="creative_type" value="upload" checked> Upload Finished Ad Image</label>
                    <label><input type="radio" name="creative_type" value="build"> Provide Details (We'll format it)</label>
                </div>
            </div>

            <!-- Option A: Upload Finished Image -->
            <div class="conditional-section" id="upload-section">
                <div class="form-group">
                    <label for="ad-image">Upload Ad Image <span class="help-text">Ensure dimensions match your selected placement (970x530 or 2560x265). Format: JPG or PNG.</span></label>
                    <input type="file" id="ad-image" name="ad_image" accept="image/png, image/jpeg">
                </div>
            </div>

            <!-- Option B: Provide Details -->
            <div class="conditional-section" id="build-section">
                <div class="grid-2">
                    <div class="form-group">
                        <label for="company-logo">Company Logo Image</label>
                        <input type="file" id="company-logo" name="company_logo" accept="image/png, image/jpeg">
                    </div>
                    <div class="form-group">
                        <label for="display-name">Display Company Name</label>
                        <input type="text" id="display-name" name="display_name">
                    </div>
                </div>
                <div class="form-group">
                    <label for="ad-header">Ad Headline</label>
                    <input type="text" id="ad-header" name="ad_header" placeholder="Catchy headline for your ad">
                </div>
                <div class="form-group">
                    <label for="ad-description">Ad Description</label>
                    <textarea id="ad-description" name="ad_description" rows="3" placeholder="Brief description of your services or offer..."></textarea>
                </div>
            </div>
        </div>

        <button type="submit">Submit Advertisement Request</button>
    </form>
</div>

</body>
</html>
